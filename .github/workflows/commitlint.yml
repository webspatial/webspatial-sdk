name: Commit Lint

on:
  push:
    branches:
      - main
      - stable
  pull_request:

permissions:
  contents: read

env:
  CI: true
  SKIP_SIMPLE_GIT_HOOKS: 1

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v5
        with:
          # Need full history so commitlint can inspect every commit in the PR range.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test commit message rules
        run: pnpm test:commitlint

      - name: Validate commit messages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Lint every commit in the PR range (base..head).
            node tools/scripts/lint-commit-range.cjs \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}" \
              --verbose
          else
            # On push to main/stable, lint the commits introduced by this push.
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              node tools/scripts/lint-commit-range.cjs \
                --from "${{ github.event.before }}" \
                --to "${{ github.sha }}" \
                --verbose
            else
              # Initial push or force-push with no usable base: lint just the HEAD commit.
              node tools/scripts/lint-commit-range.cjs --to "${{ github.sha }}"
            fi
          fi
